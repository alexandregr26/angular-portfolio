<header>
    <nav class="navbar navbar-expand navbar-light" aria-label="Primary navigation">
        <div id="navbar-container" class="container">
            <div class="navbar-brand">
                <div class="language-selector" (click)="$event.stopPropagation()">
                    <button class="nav-mark language-trigger" type="button" [attr.aria-label]="'Select language. Current language: ' + selectedLanguage.label" [attr.aria-expanded]="isLanguageMenuOpen" aria-haspopup="menu" (click)="toggleLanguageMenu($event)">
                        <img [src]="selectedLanguage.flag" [alt]="selectedLanguage.label + ' flag'">
                    </button>
                    <div class="language-menu" *ngIf="isLanguageMenuOpen" role="menu">
                        <button *ngFor="let language of languages" class="language-option" type="button" role="menuitem" [class.active]="language.code === selectedLanguage.code" (click)="selectLanguage(language, $event)">
                            <img [src]="language.flag" [alt]="language.label + ' flag'">
                            <span>{{ language.label }}</span>
                        </button>
                    </div>
                </div>
                <a class="nav-logo" href="#">Alexandre Gouveia Rodrigues</a>
            </div>
            <div class="navbar-collapse desktop-nav" id="navbarNav">
                <div class="mr-auto"></div>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link liquid-glass" href="#about" (pointermove)="moveLiquidGlass($event)" (pointerleave)="resetLiquidGlass($event)">About</a>
                    </li>
                    <li class="nav-item active">
                        <a class="nav-link liquid-glass" href="#work" (pointermove)="moveLiquidGlass($event)" (pointerleave)="resetLiquidGlass($event)">Work</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link liquid-glass" href="#projects" (pointermove)="moveLiquidGlass($event)" (pointerleave)="resetLiquidGlass($event)">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link liquid-glass" href="#skills" (pointermove)="moveLiquidGlass($event)" (pointerleave)="resetLiquidGlass($event)">Skills</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link liquid-glass" href="#community" (pointermove)="moveLiquidGlass($event)" (pointerleave)="resetLiquidGlass($event)">Community</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link liquid-glass" routerLink="/" fragment="contact" (pointermove)="moveLiquidGlass($event)" (pointerleave)="resetLiquidGlass($event)">Contact</a>
                    </li>
                </ul>
                <a class="nav-resume" href="assets/pdf/AlexandreGouveiaRodriguesResume.pdf" target="_blank">Resume</a>
                <li class="nav-icon">
                    <a target="_blank" href="https://www.linkedin.com/in/alexandre-gouveia-r/"><i
                            class='bx bxl-linkedin-square'></i><span class="sr-only">LinkedIn</span></a>
                </li>
                <li class="nav-icon">
                    <a target="_blank" href="https://github.com/alexandregr26/"><i
                            class='bx bxl-github'></i><span class="sr-only">GitHub</span></a>
                </li>
            </div>
            <details class="mobile-nav">
                <summary aria-label="Open navigation menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </summary>
                <div class="mobile-panel">
                    <a href="#about">About</a>
                    <a href="#work">Work</a>
                    <a href="#projects">Projects</a>
                    <a href="#skills">Skills</a>
                    <a href="#community">Community</a>
                    <a routerLink="/" fragment="contact">Contact</a>
                    <a href="assets/pdf/AlexandreGouveiaRodriguesResume.pdf" target="_blank">Resume</a>
                    <a target="_blank" href="https://www.linkedin.com/in/alexandre-gouveia-r/">LinkedIn</a>
                    <a target="_blank" href="https://github.com/alexandregr26/">GitHub</a>
                </div>
            </details>
        </div>
    </nav>
</header>
